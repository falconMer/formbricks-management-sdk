name: Verify ROR SDK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --prefix .sdk
      - run: npm ci --prefix ts
      - run: npm run generate
      - run: git diff --exit-code -- ts/src ts/test ts/README.md ts/REFERENCE.md ts/package.json
      - run: npm test
      - run: npm run doctor
      - name: Live public API check
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:live
